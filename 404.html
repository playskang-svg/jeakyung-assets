<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>재경닷컴</title>
<script>
  // GitHub Pages는 SPA 하위 경로(/groupware/...)를 직접 서빙하지 못하므로,
  // /groupware/로 시작하는 새로고침·직접 접속 경로는 원래 경로를 저장해두고
  // groupware/index.html로 보낸 뒤, 그 앱이 부팅되기 전에 경로를 복원한다.
  (function () {
    var path = window.location.pathname + window.location.search + window.location.hash;
    if (path.indexOf('/groupware/') === 0 || path === '/groupware') {
      sessionStorage.setItem('gw-redirect', path);
      window.location.replace('/groupware/index.html');
    } else {
      window.location.replace('/');
    }
  })();
</script>
</head>
<body></body>
</html>
