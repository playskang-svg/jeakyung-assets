<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 · 재경닷컴</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100svh; display: grid; place-items: center;
    padding: 24px; background: #f5f7fb; color: #10121a;
    font-family: Pretendard, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Malgun Gothic', sans-serif;
  }
  main { max-width: 460px; text-align: center; }
  p.code { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .18em; color: #1a46ff; }
  h1 { margin: 14px 0 12px; font-size: clamp(24px, 4vw, 32px); letter-spacing: -.03em; }
  p.lead { margin: 0 0 28px; font-size: 15px; line-height: 1.7; color: #6a707c; }
  a {
    display: inline-block; padding: 13px 26px; border-radius: 999px;
    background: #1a46ff; color: #fff; font-size: 15px; font-weight: 600; text-decoration: none;
  }
  a:hover { background: #0f34d6; }
</style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p class="lead">주소가 바뀌었거나 삭제된 페이지입니다.<br>아래 버튼으로 첫 화면에서 다시 찾아보세요.</p>
    <a href="/">재경닷컴 홈으로</a>
  </main>

</html>
