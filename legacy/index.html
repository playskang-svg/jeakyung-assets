<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이전 인트라넷 - 재경로지스&amp;물류</title>
<meta name="robots" content="noindex, nofollow">
<!--
  옛 인트라넷(quv.kr) 로 가는 버튼 모음. 새 그룹웨어로 옮기는 동안 예전 자료를
  찾을 수 있게 그대로 둔다. 홈 화면 '페이지' 박스의 '이전 인트라넷' 버튼이
  이 파일을 액자 안에서 연다.

  손으로 관리하는 쪽이다 — scripts/sync-build.mjs 가 건드리지 않는다.
-->
<style>
  :root{
    --gray:#6c6c6c;
    --gray-hover:#000;
    --red:#d57373;
    --red-hover:#d6a5a5;
    --line:#cecece;
    --bg-bar:#e7e7e7;
    --num:#42a5f5;
    --title:#444;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:24px 16px 48px;
    font-family:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
    color:var(--title);
    background:#fff;
  }
  .wrap{max-width:1000px;margin:0 auto;}

  /* 상단 바 버튼 */
  .bar{
    background:var(--bg-bar);
    padding:20px 16px;
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    justify-content:center;
    margin-bottom:24px;
  }
  .btn-bar{
    display:inline-block;
    min-width:172px;
    padding:10px 16px;
    background:var(--gray);
    color:#fff;
    font-size:18px;
    text-align:center;
    text-decoration:none;
    border:1px solid transparent;
    transition:.2s;
  }
  .btn-bar:hover{background:var(--gray-hover);color:#fff;}

  /* 홈 버튼 */
  .btn-home{
    display:inline-block;
    padding:10px 28px;
    background:#fff;
    color:#333;
    border:1px solid var(--line);
    border-radius:25px;
    text-decoration:none;
    font-size:16px;
    transition:.2s;
  }
  .btn-home:hover{background:var(--bg-bar);color:#000;}
  .home-wrap{margin-bottom:24px;}

  /* 카드 그리드 */
  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
  }
  .card{
    border:1px solid var(--line);
    padding:28px 16px;
    text-align:center;
  }
  .card .num{
    font-family:Oswald,sans-serif;
    font-size:34px;
    color:var(--num);
    line-height:1.2;
  }
  .card .name{
    font-family:Oswald,"Noto Sans KR",sans-serif;
    font-size:28px;
    color:var(--title);
    margin:4px 0 6px;
  }
  .card .desc{font-size:14px;color:#777;margin-bottom:18px;min-height:20px;}
  .btn-go{
    display:inline-block;
    width:134px;
    padding:10px 0;
    background:var(--red);
    color:#fff;
    border:1px solid var(--red);
    border-radius:25px;
    text-decoration:none;
    font-family:Montserrat,sans-serif;
    transition:.2s;
  }
  .btn-go:hover{background:var(--red-hover);border-color:var(--red-hover);color:#fff;}

  @media (max-width:767px){
    .grid{grid-template-columns:1fr;}
    .btn-bar{width:100%;}
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- 홈 -->
  <div class="home-wrap">
    <a class="btn-home" href="/groupware/dashboard" target="_top">← 홈</a>
  </div>

  <!-- 상단 바 -->
  <div class="bar">
    <a class="btn-bar" href="https://mail.jeakyung.com/" target="_blank" rel="noopener">사내메일</a>
    <a class="btn-bar" href="https://jeakyung.quv.kr/in01">공지사항</a>
  </div>

  <!-- 메뉴 카드 -->
  <div class="grid">
    <div class="card">
      <div class="num">1</div>
      <div class="name">업무보고</div>
      <div class="desc"></div>
      <a class="btn-go" href="https://jeakyung.quv.kr/27">바로가기</a>
    </div>

    <div class="card">
      <div class="num">2</div>
      <div class="name">사내게시판</div>
      <div class="desc"></div>
      <a class="btn-go" href="https://jeakyung.quv.kr/42">바로가기</a>
    </div>

    <div class="card">
      <div class="num">3</div>
      <div class="name">일반업무</div>
      <div class="desc">사업장별 업무 구분</div>
      <a class="btn-go" href="https://jeakyung.quv.kr/33">바로가기</a>
    </div>

    <div class="card">
      <div class="num">4</div>
      <div class="name">지입업무</div>
      <div class="desc">운송사 및 차량 관련 업무</div>
      <a class="btn-go" href="https://jeakyung.quv.kr/41">바로가기</a>
    </div>

    <div class="card">
      <div class="num">5</div>
      <div class="name">사내앨범</div>
      <div class="desc">사업장 및 업무 관련 참고자료</div>
      <a class="btn-go" href="https://jeakyung.quv.kr/29">바로가기</a>
    </div>

    <div class="card">
      <div class="num">6</div>
      <div class="name">자유게시판</div>
      <div class="desc">직원 소통을 위한</div>
      <a class="btn-go" href="https://jeakyung.quv.kr/37">바로가기</a>
    </div>

    <div class="card">
      <div class="num">*</div>
      <div class="name">사내일정</div>
      <div class="desc">주요 공유 일정</div>
      <a class="btn-go" href="https://jeakyung.quv.kr/36" target="_blank" rel="noopener">바로가기</a>
    </div>

    <div class="card">
      <div class="num">*</div>
      <div class="name">재경로지스｜물류</div>
      <div class="desc">네이버 카페 (업무 정보공유)</div>
      <a class="btn-go" href="https://cafe.naver.com/logisjk" target="_blank" rel="noopener">바로가기</a>
    </div>
  </div>

  <!-- 하단 바 -->
  <div class="bar" style="margin-top:24px;">
    <a class="btn-bar" href="https://jeakyung.quv.kr/17">대표님</a>
    <a class="btn-bar" href="https://seller.payapp.kr/r/using_reg?payreqtype=krw" target="_blank" rel="noopener">결제 링크 발송</a>
  </div>

</div>
</body>
</html>
